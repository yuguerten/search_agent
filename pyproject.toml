[project]
name = "agentic-literature-researcher"
version = "0.1.0"
description = "Agentic academic literature researcher using Google ADK, LiteLLM, arXiv, and PostgreSQL."
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp,extensions]>=2.0.0,<3.0.0",
    "litellm>=1.60.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

